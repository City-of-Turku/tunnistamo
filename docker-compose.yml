services:
    postgres:
        image: postgres:15-alpine
        environment:
            POSTGRES_USER: tunnistamo
            POSTGRES_PASSWORD: tunnistamo
            POSTGRES_DB: tunnistamo
        ports:
            - 5432:5432
        volumes:
            - postgres-data-volume:/var/lib/postgresql/data
        container_name: tunnistamo-db

    django:
        build:
            context: .
            target: development
        env_file:
            - docker-compose.env.yaml
        environment:
            DATABASE_URL: postgres://tunnistamo:tunnistamo@postgres/tunnistamo
            DATABASE_HOST: postgres
            SKIP_CERTIFICATES: "true"
            NODE_MODULES_ROOT: /var/tunnistamo/node_modules
        volumes:
            - .:/app
            - django-media-volume:/var/media/
        ports:
            - 8000:8000
        depends_on:
            - postgres
        container_name: tunnistamo-backend

volumes:
    postgres-data-volume:
    django-media-volume:

networks:
    default:
        name: helsinki
